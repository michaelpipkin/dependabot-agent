# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Reusable workflow for the `targeted` update strategy (npm only). A repository
# calls it from its own `schedule` and `workflow_dispatch`; see "Targeted mode
# (npm)" in the README for a calling workflow and for what each token needs.
name: Targeted Dependabot fixes

on:
  workflow_call:
    inputs:
      base-branch:
        description: "Branch to run against and to open the pull request into."
        type: string
        required: true
      agent-version:
        description: "Version of dependabot-agent to run. Required so each caller pins what it trusts."
        type: string
        required: true
      node-version:
        description: "Node.js version to run the agent with. Its bundled npm is the npm that resolves the lockfile: Node 24 ships npm 11, which targeted mode is tested on."
        type: string
        default: "24"
      dry-run:
        description: "Print the plan to the job summary. Writes nothing: no pull request, no issue."
        type: boolean
        default: false
      app-client-id:
        description: "A GitHub App's Client ID, to use the App instead of alerts-token and pr-token. Pass with app-private-key. The App needs Dependabot alerts read, and contents and pull requests write."
        type: string
        required: false
        default: ""
    # Pass an App (app-client-id and app-private-key), or both tokens. The first step checks.
    secrets:
      app-private-key:
        description: "The private key of the App named by app-client-id."
        required: false
      alerts-token:
        description: "Can read Dependabot alerts: a classic PAT with security_events, or a fine-grained token with Dependabot alerts: read. The built-in GITHUB_TOKEN can't."
        required: false
      pr-token:
        description: "Opens the pull request. Not GITHUB_TOKEN: PRs it opens don't trigger your CI. Needs contents and pull requests write."
        required: false

# Three jobs, each on its own machine, because a job's secrets are in its runner's memory
# and hosted runners give steps sudo. Only plan runs the agent's code, and it refers to no
# secret at all. alerts fetches the alerts into a file for it. publish starts clean and
# does the writing. The README says what this does and doesn't protect against.
jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      credentials-ok: ${{ steps.credentials.outputs.ok }}
      alerts-artifact: ${{ steps.save-alerts.outputs.artifact-id }}
    steps:
      # Only whether each was passed: no value reaches this step's environment.
      - name: Check the credentials
        id: credentials
        env:
          HAS_APP_CLIENT_ID: ${{ inputs.app-client-id != '' }}
          HAS_APP_PRIVATE_KEY: ${{ secrets.app-private-key != '' }}
          HAS_ALERTS_TOKEN: ${{ secrets.alerts-token != '' }}
          HAS_PR_TOKEN: ${{ secrets.pr-token != '' }}
        run: |
          fail() {
            echo "::error title=dependabot-agent credentials::$1"
            exit 1
          }
          if [ "$HAS_APP_CLIENT_ID" = "true" ] || [ "$HAS_APP_PRIVATE_KEY" = "true" ]; then
            if [ "$HAS_ALERTS_TOKEN" = "true" ] || [ "$HAS_PR_TOKEN" = "true" ]; then
              fail "Pass a GitHub App or tokens, not both."
            fi
            [ "$HAS_APP_CLIENT_ID" = "true" ] || fail "app-private-key was passed without app-client-id."
            [ "$HAS_APP_PRIVATE_KEY" = "true" ] || fail "app-client-id was passed without app-private-key. If it's set from a secret, check that the secret reaches this workflow."
          else
            if [ "$HAS_ALERTS_TOKEN" != "true" ] && [ "$HAS_PR_TOKEN" != "true" ]; then
              fail "No credentials. Pass app-client-id and app-private-key, or alerts-token and pr-token."
            fi
            [ "$HAS_ALERTS_TOKEN" = "true" ] || fail "pr-token was passed without alerts-token."
            [ "$HAS_PR_TOKEN" = "true" ] || fail "alerts-token was passed without pr-token."
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Create a token to read alerts
        id: app-alerts
        if: ${{ inputs.app-client-id != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-vulnerability-alerts: read

      # Every state, not just open: the agent also needs to know which packages were ever alerted.
      - name: Fetch the alerts
        id: fetch
        env:
          GH_TOKEN: ${{ steps.app-alerts.outputs.token || secrets.alerts-token }}
          AGENT_ALERTS_DIR: ${{ runner.temp }}/agent-alerts
        run: |
          set -euo pipefail
          mkdir -p "$AGENT_ALERTS_DIR"
          gh api --paginate "repos/$GITHUB_REPOSITORY/dependabot/alerts?ecosystem=npm&per_page=100" | jq -s 'add // []' > "$AGENT_ALERTS_DIR/alerts.json"

      - name: Keep the alerts for the next job
        id: save-alerts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependabot-agent-alerts
          path: ${{ runner.temp }}/agent-alerts/alerts.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # On a failed alerts job too, so the failure reaches the issue. Refers to no secret: see the top.
  plan:
    needs: alerts
    if: ${{ !cancelled() && needs.alerts.outputs.credentials-ok == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.report.outputs.outcome }}
      blocked-count: ${{ steps.report.outputs.blocked-count }}
      restore-error: ${{ steps.report.outputs.restore-error }}
      results-artifact: ${{ steps.save-results.outputs.artifact-id }}
    steps:
      - name: Check out the base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base-branch }}
          persist-credentials: false

      # package-manager-cache: on by default for a repository that declares npm as its package
      # manager, and it could carry a compromised run's code into later runs.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      # Not on a failed alerts job: a re-run could otherwise find an earlier attempt's alerts.
      - name: Fetch the alerts
        id: fetch-alerts
        if: ${{ needs.alerts.result == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.alerts.outputs.alerts-artifact }}
          path: ${{ runner.temp }}/agent-alerts

      # The agent needs no node_modules: every npm command it runs is --package-lock-only.
      # It exits 1 when the run fails, and the report is still read below, so don't stop here.
      - name: Run dependabot-agent (targeted)
        id: agent
        if: ${{ steps.fetch-alerts.outcome == 'success' }}
        continue-on-error: true
        # Shorter than the job's, so a hang still reaches the report step and the issue.
        timeout-minutes: 45
        env:
          AGENT_VERSION: ${{ inputs.agent-version }}
          # From the input either way, so a repository's "dryRun": true can't quietly stop a real run from opening its PR.
          DRY_RUN: ${{ inputs.dry-run }}
          AGENT_REPOSITORY: ${{ github.repository }}
          # Outside the checkout, so it can't end up in the patch or the commit.
          AGENT_REPORT_DIR: ${{ runner.temp }}/agent-report
          AGENT_ALERTS_FILE: ${{ runner.temp }}/agent-alerts/alerts.json
          # npx runs no install scripts of the package or its dependencies.
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
          # A caller's exitCode setting would make a run with changes exit 2, which would read as failed.
          EXIT_CODE: "false"
        run: npx -y "dependabot-agent@${AGENT_VERSION}" --update-strategy targeted --repo "$AGENT_REPOSITORY" --report "$AGENT_REPORT_DIR" --alerts-file "$AGENT_ALERTS_FILE"

      # No report.json means the run never got as far as writing one (no alerts to read, a
      # crash at startup, or npx couldn't fetch the package). That counts as failed.
      - name: Read the report
        id: report
        env:
          AGENT_REPORT_DIR: ${{ runner.temp }}/agent-report
          AGENT_STEP_OUTCOME: ${{ steps.agent.outcome }}
        run: |
          set -euo pipefail
          dir="$AGENT_REPORT_DIR"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          outcome=""
          blocked=0
          restore=false

          if [ -f "$dir/report.md" ] && [ -f "$dir/report.json" ] && jq -e . "$dir/report.json" > /dev/null 2>&1; then
            outcome=$(jq -r '.outcome? // empty' "$dir/report.json" 2> /dev/null || true)
            blocked=$(jq -r '.blockedCount? // 0' "$dir/report.json" 2> /dev/null || echo 0)
            if [ "$(jq -r '(.restoreError? // "") | tostring | length' "$dir/report.json" 2> /dev/null || echo 0)" != "0" ]; then
              restore=true
            fi
          fi
          case "$outcome" in changes | blocked-only | clean | failed) ;; *) outcome="" ;; esac
          case "$blocked" in '' | *[!0-9]*) blocked=0 ;; esac

          if [ -z "$outcome" ]; then
            outcome=failed
            blocked=0
            restore=false
            mkdir -p "$dir"
            rm -f "$dir/report-full.md"
            why="**The run failed and no report was produced.** The agent may have stopped before it started, or npx could not fetch it."
            if [ "$AGENT_STEP_OUTCOME" = "skipped" ]; then
              why="**The Dependabot alerts weren't available, so the agent didn't run.** Check that the credentials are still valid and, for a GitHub App, that it's installed on this repository. If this is a re-run of failed jobs more than a day later, the saved alerts have expired: re-run all jobs."
            fi
            cat > "$dir/report.md" << EOF
          # Targeted dependency fixes

          > $why See the [workflow run]($run_url) for its log.
          EOF
          elif [ "$AGENT_STEP_OUTCOME" != "success" ] && [ "$outcome" != "failed" ]; then
            # An error exit means whatever the report says can't be trusted to match the files.
            outcome=failed
            for file in "$dir/report.md" "$dir/report-full.md"; do
              if [ -f "$file" ]; then
                printf '\n\n> The agent exited with an error after writing this report, so the run is treated as failed. See the [workflow run](%s).\n' "$run_url" >> "$file"
              fi
            done
          fi
          if [ "$restore" = "true" ]; then
            outcome=failed
          fi

          # report.md promises the complete report is in the job summary when it was cut.
          summary="$dir/report.md"
          if [ -f "$dir/report-full.md" ]; then
            summary="$dir/report-full.md"
          fi
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

          {
            echo "outcome=$outcome"
            echo "blocked-count=$blocked"
            echo "restore-error=$restore"
          } >> "$GITHUB_OUTPUT"

      # Only the fix travels to the next job, as a patch of the package files.
      - name: Save the changes as a patch
        id: patch
        env:
          AGENT_REPORT_DIR: ${{ runner.temp }}/agent-report
        run: git diff --binary -- ':(glob)**/package.json' ':(glob)**/package-lock.json' > "$AGENT_REPORT_DIR/fixes.patch"

      - name: Keep the results for the next job
        id: save-results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependabot-agent-results
          path: |
            ${{ runner.temp }}/agent-report/report.md
            ${{ runner.temp }}/agent-report/fixes.patch
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Fail the job when the run failed
        if: ${{ !cancelled() && steps.report.outputs.outcome == 'failed' }}
        run: |
          echo "::error title=dependabot-agent failed::The targeted run failed, so no pull request was opened. See the job summary."
          exit 1

  # On a failed plan too, so the failure reaches the issue. Nothing to do on a dry run,
  # and no outcome means plan never ran, or stopped before reading a report: the failure says why.
  publish:
    needs: plan
    if: ${{ !cancelled() && !inputs.dry-run && needs.plan.outputs.outcome != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A schedule and a manual run would otherwise race on the one branch and one issue.
    concurrency:
      group: dependabot-agent-targeted-${{ inputs.base-branch }}
      cancel-in-progress: false
    # GITHUB_TOKEN only checks out the repository and manages the issue. The pull request
    # is opened with its own token, which carries its own permissions.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base-branch }}
          # create-pull-request pushes with its own token, so no credential needs to stay in .git.
          persist-credentials: false

      - name: Fetch the results of the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.plan.outputs.results-artifact }}
          path: ${{ runner.temp }}/agent-report

      # The patch came from the job that ran the agent, so it's checked before it's trusted:
      # edits to package files only, and a result that agrees with what the report claims.
      - name: Apply the changes
        id: apply
        if: ${{ needs.plan.outputs.outcome != 'failed' && needs.plan.outputs.restore-error != 'true' }}
        env:
          AGENT_REPORT_DIR: ${{ runner.temp }}/agent-report
          OUTCOME: ${{ needs.plan.outputs.outcome }}
        run: |
          fail() {
            echo "::error title=dependabot-agent patch::$1"
            exit 1
          }
          patch="$AGENT_REPORT_DIR/fixes.patch"
          if [ ! -s "$patch" ]; then
            [ "$OUTCOME" != "changes" ] || fail "The report says files changed, but the patch is empty."
            exit 0
          fi
          [ "$OUTCOME" = "changes" ] || fail "The report's outcome is $OUTCOME, but the patch isn't empty."
          # Header lines only: everything inside a hunk starts with a space, + or -.
          if grep -qE '^(rename |copy |similarity |dissimilarity |old mode |new mode |new file |deleted file |GIT binary patch)' "$patch"; then
            fail "The patch does more than edit file contents."
          fi
          git apply --include='package.json' --include='package-lock.json' --include='*/package.json' --include='*/package-lock.json' "$patch"
          # Judged by what it did, too: a patch can leave out the headers that describe it.
          status=$(git status --porcelain --ignored)
          [ -n "$status" ] || fail "The patch changed no package file."
          if grep -qvE '^ M (.*/)?package(-lock)?\.json$' <<< "$status"; then
            fail "The patch does more than edit file contents."
          fi
          if git diff --raw | grep -qvE '^:100644 100644 '; then
            fail "The patch does more than edit file contents."
          fi

      - name: Create a token to open the pull request
        id: app-pr
        if: ${{ inputs.app-client-id != '' && needs.plan.outputs.outcome != 'failed' && needs.plan.outputs.restore-error != 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write

      # Runs for clean and blocked-only too: with no diff, create-pull-request closes
      # a stale PR from an earlier run instead of leaving it open.
      - name: Open or update the pull request
        if: ${{ needs.plan.outputs.outcome != 'failed' && needs.plan.outputs.restore-error != 'true' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-pr.outputs.token || secrets.pr-token }}
          base: ${{ inputs.base-branch }}
          branch: dependabot-agent/targeted
          # Only the fix: nothing else in the checkout may be committed. These match the root's
          # files too. A literal name that matched nothing would fail the whole git add, which
          # this action ignores, leaving a green run with no pull request.
          add-paths: |
            :(glob)**/package.json
            :(glob)**/package-lock.json
          commit-message: "fix(deps): resolve Dependabot alerts with targeted changes"
          title: "fix(deps): resolve Dependabot alerts with targeted changes"
          body-path: ${{ runner.temp }}/agent-report/report.md
          delete-branch: true

      - name: Update the blocked-alerts issue
        id: issue
        # After a failed step too, so a failure to publish doesn't leave the issue saying all is well.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ needs.plan.outputs.outcome }}
          BLOCKED_COUNT: ${{ needs.plan.outputs.blocked-count }}
          AGENT_REPORT_DIR: ${{ runner.temp }}/agent-report
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          label="dependabot-agent-blocked"
          title="Dependabot alerts the agent could not fix"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$JOB_STATUS" != "success" ]; then
            mkdir -p "$AGENT_REPORT_DIR"
            printf '\n\n> **Publishing these results failed**, so any open pull request may not reflect them. See the [workflow run](%s).\n' "$run_url" >> "$AGENT_REPORT_DIR/report.md"
            OUTCOME=failed
          fi
          open=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')

          case "$OUTCOME" in
            blocked-only | failed)
              gh label create "$label" --color B60205 --description "Dependabot alerts that dependabot-agent left for a person" --force > /dev/null
              if [ -n "$open" ]; then
                gh issue edit "$open" --title "$title" --body-file "$AGENT_REPORT_DIR/report.md"
              else
                gh issue create --title "$title" --label "$label" --body-file "$AGENT_REPORT_DIR/report.md"
              fi
              ;;
            clean | changes)
              if [ -z "$open" ]; then
                :
              elif [ "$OUTCOME" = "clean" ] || [ "$BLOCKED_COUNT" = "0" ]; then
                gh issue close "$open" --comment "Nothing is blocked as of [this run]($run_url)."
              else
                # With a PR open and some copies still blocked, the PR's report lists them, so no
                # issue is created. One already open is brought up to date: it may say a run failed.
                gh issue edit "$open" --title "$title" --body-file "$AGENT_REPORT_DIR/report.md"
              fi
              ;;
          esac
